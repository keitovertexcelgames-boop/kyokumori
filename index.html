<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>極盛軒</title>
<style>
html,body{margin:0;padding:0;position:fixed;inset:0;width:100%;height:100%;background:#140e0a;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#unity-canvas{display:block;background:#140e0a;width:100vw;height:100vh;height:100dvh;touch-action:none;outline:none}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#f6e7d4;font:600 16px sans-serif;text-align:center}
#bar{width:200px;height:6px;background:#3a2a20;border-radius:3px;margin-top:10px}#fill{height:100%;width:0;background:#e6b15a;border-radius:3px}
</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="load">極盛軒 読み込み中…<div id="bar"><div id="fill"></div></div></div>
<script>
(function(){
  // Unlock Web Audio on first touch (iOS Safari).
  var AC=window.AudioContext||window.webkitAudioContext,_ctxs=[];
  if(AC){var O=AC;window.AudioContext=window.webkitAudioContext=function(o){var c=new O(o);_ctxs.push(c);return c;};window.AudioContext.prototype=O.prototype;}
  function unlock(){_ctxs.forEach(function(c){if(c.state!=="running")c.resume();try{var b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}});}
  ["touchstart","touchend","pointerdown","mousedown","keydown"].forEach(function(e){document.addEventListener(e,unlock,{capture:true,passive:true});});
  // Block iOS pinch/double-tap zoom and rubber-band scroll; Unity listens on the canvas directly.
  ["gesturestart","gesturechange","gestureend"].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault();},{passive:false});});
  var lastEnd=0;document.addEventListener("touchend",function(ev){var n=Date.now();if(n-lastEnd<300)ev.preventDefault();lastEnd=n;},{passive:false});
  document.addEventListener("touchmove",function(ev){ev.preventDefault();},{passive:false});
  var canvas=document.getElementById("unity-canvas");
  var s=document.createElement("script");
  s.src="Build/web.loader.js";
  s.onload=function(){
    createUnityInstance(canvas,{
      dataUrl:"Build/web.data.unityweb",frameworkUrl:"Build/web.framework.js.unityweb",codeUrl:"Build/web.wasm.unityweb",
      streamingAssetsUrl:"StreamingAssets",companyName:"Vertexel Games",productName:"極盛軒",productVersion:"1.0",
      matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
    },function(p){document.getElementById("fill").style.width=(p*100)+"%";}).then(function(){document.getElementById("load").remove();}).catch(function(m){document.getElementById("load").textContent=m;});
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
